# ======================================================================================
#  Globale Einstellungen - Pore Detection V2
# ======================================================================================
#  Bearbeitet wird config/einstellungen.yaml - sie wird bei jedem Lauf gelesen (CLI,
#  GUI-Vorschau, Pipeline). config/default.yaml ist die unveraenderte Vorlage.
#  Vollstaendige Erklaerungen je Wert: src/poredet/config/schema.py
#
#  ZURUECK AUF STANDARD:
#    - kurz:     standardwerte_verwenden: true   -> diese Datei wird ignoriert,
#                                                   deine Aenderungen bleiben erhalten
#    - komplett: python -m poredet config --reset -> Datei wird durch config/default.yaml
#                                                   ersetzt (Originalwerte)
#  Unbekannte Schluessel sind ein Fehler - ein Tippfehler faellt also sofort auf.
# ======================================================================================

standardwerte_verwenden: false     # true = alles hier ignorieren, eingebaute Standardwerte nehmen
require_scale: false               # true = Bild abbrechen, wenn kein Massstab erkannt wird

# --------------------------------------------------------------------------------------
# 1. MASSSTAB
# --------------------------------------------------------------------------------------
scale:
  min_um_per_px: 1.0e-6            # harte Grenze: darunter verwerfen
  max_um_per_px: 1.0e+12           # harte Grenze: darueber verwerfen
  expected_min_um_per_px: 1.0e-3   # Erwartungsfenster: ausserhalb nur Warnung
  expected_max_um_per_px: 1.0e+3
  exclusion_pad_px: 4              # Rand um das Overlay, der aus der Analyse faellt
  overrides: {}                    # Regex auf Dateiname -> µm/px, z.B. {"^probe_7": 0.52}

  bar:                             # Geometrie des eingebrannten Balkens/Kastens
    ink_max: 120                   # Grauwert bis hier = Schrift/Balken
    box_white_min: 255             # Grauwert ab hier = Kastenweiss (bewusst 255)
    box_white_fallback: 250        # zweiter Versuch, z.B. bei JPEG
    env_white_min: 250             # Schwelle fuer "Balken liegt im Weissen"
    min_bar_px: 10                 # kuerzester Balken
    max_bar_height_px: 40          # hoechster Balken in px
    max_bar_height_frac: 0.05      # hoechster Balken als Anteil der Bildhoehe
    min_bar_aspect: 3.0            # Balken mind. so viel breiter als hoch
    min_bar_fill: 0.85             # Fuellgrad der Bounding Box (massiv vs. Kratzer)
    min_env_white: 0.5             # Anteil Weiss ueber/unter dem Balken
    split_probe_px: 4              # Bauform "Balken zerschneidet Kasten": Suchzeilen
    min_split_cover: 0.9           #   Anteil Balkenbreite je Kastenhaelfte
    max_split_offset: 0.15         #   max. seitlicher Versatz der Haelften
    min_box_rectangularity: 0.70   # Kasten muss rechteckig sein
    max_box_width_factor: 8.0      # Kasten max. x-mal breiter als der Balken
    max_box_height_factor: 40.0    # Kasten max. x-mal hoeher als der Balken
    max_box_area_frac: 0.35        # Kasten max. Anteil der Bildflaeche
    min_label_height_px: 3         # kleinste Schrifthoehe
    max_candidates: 8              # so viele Balkenkandidaten werden geprueft

  ocr:                             # Lesen der Beschriftung (Mehrheitsentscheid)
    engines: [rapidocr, tesseract] # befragte OCR-Engines
    engine_weights: {rapidocr: 1.0, tesseract: 0.85}  # Stimmgewicht je Engine
    variant_heights: [48, 40, 64]  # Zielhoehen der hochskalierten Textzeile
    binarized_variant: true        # zusaetzlich Otsu-binarisierte Fassung lesen
    min_consensus_weight: 1.5      # ab diesem Stimmgewicht ohne Gegenstimme: fertig
    cross_check: true              # ueberstimmte Lesungen als Warnung vermerken
    target_text_height_px: 48      # Zielhoehe eines einzelnen Leseversuchs
    max_upscale: 8.0               # max. Vergroesserung
    pad_factor: 0.6                # Rand um die Textzeile (x Zeilenhoehe)
    quiet_zone_px: 24              # weisser Rahmen um den Ausschnitt

# --------------------------------------------------------------------------------------
# 2. PROBE / EINBETTMITTEL
# --------------------------------------------------------------------------------------
specimen:
  method: grabcut                  # grabcut | lasso | random_walker | watershed | chan_vese
                                   # | boundary_path | full_frame | largest_region
  work_max_px: 1200                # Rechenaufloesung (laengere Kante)
  min_specimen_frac: 0.02          # kleinere Probenstuecke verwerfen (Anteil Bildflaeche)
  keep: all_above_min              # largest | all_above_min
  erode_border_px: 0               # Probenrand schrumpfen (dunkle Kantenabrundung)

  grabcut:
    iterations: 3                  # Iterationen (1-10)
    max_px: 800                    # eigene Rechenaufloesung

  lasso:                           # Harz als randoffener, dunkler, glatter Saum
    denoise_ksize: 5               # Median gegen Rauschen
    texture_ksize_px: 9            # Fenster der lokalen Textur
    dark_method: otsu              # otsu | multiotsu | percentile
    dark_percentile: 25.0          #   nur bei percentile
    multiotsu_classes: 3           #   nur bei multiotsu
    multiotsu_level: 0
    dark_offset: 0                 # Schwelle verschieben, + = mehr Harz
    texture_method: otsu           # otsu | percentile
    texture_percentile: 30.0       #   nur bei percentile
    texture_clip_percentile: 99.0  # robustes Maximum fuer die Normierung
    min_texture_separability: 0.45 # darunter Texturkriterium aus
    core_erode_px: 6               # Abstand zum Maskenrand fuer die Harzschaetzung
    gray_sigmas: 12.0              # Grautoleranz (mittlere Abweichungen)
    texture_sigmas: 5.0            # Texturtoleranz
    min_gray_tolerance: 12.0       # Boden der Grautoleranz
    min_texture_tolerance: 2.0     # Boden der Texturtoleranz
    multi_field_max_depth: 0.8     # mehrere Harzfelder: max. Tiefe ins Bild (1 = Mitte)
    close_radius_px: 10            # schliesst Saum ueber Luftblasen
    min_material_contrast: 40.0    # min. Grauabstand Harz <-> Rest
    min_area_frac: 0.02            # min. Groesse eines Harzfelds
    min_border_contact_frac: 0.12  # min. Anteil des Bildumfangs, den es beruehrt
    max_hole_frac: 0.05            # kleinere Loecher im Harz fuellen

  seeds:                           # Saat fuer random_walker / watershed / ...
    border_band_frac: 0.10         # Randstreifen fuer die Saatsuche
    erode_px: 4                    # Saat nach innen schrumpfen
    min_seed_frac: 0.0005          # min. Groesse eines Saatflecks

  random_walker:
    beta: 130.0                    # wie stark Kanten sperren
    max_px: 700                    # eigene Rechenaufloesung
    use_texture: true              # Helligkeit + Textur statt nur Grau

  chan_vese:
    iterations: 60
    smoothing: 3                   # Glaettung je Iteration (0-6)
    lambda1: 1.0                   # Gewicht aussen
    lambda2: 1.0                   # Gewicht innen
    max_px: 600

  boundary_path:
    max_px: 800
    gradient_weight: 1.0           # wie stark die Kante den Pfad anzieht
    smoothness: 0.35               # hoeher = geraderer Pfad

# --------------------------------------------------------------------------------------
# 3. PORENDETEKTION
# --------------------------------------------------------------------------------------
pore:
  method: local_contrast           # local_contrast | threshold | adaptive
  open_radius_px: 1                # entfernt Einzelpixel-Rauschen
  close_radius_px: 0               # morphologisches Schliessen (0 = aus)
  fill_holes: true                 # Loecher in Poren fuellen
  min_size_px: 4                   # Rauschgrenze in px
  exclude_edge_pores: false        # true = am Bildrand angeschnittene Poren verwerfen

  local_contrast:                  # Pore = dunkler als ihre Umgebung (Standard)
    strict_method: mad             # mad | otsu_masked | multiotsu_masked | percentile | fixed
    mad_sigmas: 6.0                #   mad: robuste Streuungen ueber Median (groesser = strenger)
    strict_percentile: 99.0        #   percentile
    strict_fixed: 25.0             #   fixed, Kontrast in Graustufen
    multiotsu_classes: 3           #   multiotsu_masked
    multiotsu_level: -1            #   -1 = oberste Schwelle
    strict_floor: 40.0             # Untergrenze der strengen Schwelle (0 = aus)
    grow_factor: 0.5               # lockere Schwelle = strenge x Faktor (Porenausdehnung)
    min_contrast: 8.0              # harte Untergrenze in Graustufen
    presmooth_sigma_px: 0.0        # Glaettung fuer die Grobsuche (0 = aus)
    extent_method: global          # global | half_max  (wie weit eine Pore reicht)
    half_max_fraction: 0.5         #   half_max: Randlage zwischen Untergrund (0) und Kern (1)
    half_max_ring_px: 3            #   half_max: Ringbreite fuer den lokalen Untergrund
    background:                    # Hintergrundschaetzung
      kernel_px: 0                 # 0 = automatisch; MUSS groesser als groesste Pore sein
      kernel_divisor: 8            # automatisch = kuerzere Bildkante / divisor
      kernel_min_px: 31            # Mindestgroesse des Kernels
      smooth_sigma_factor: 3.0     # Glaettung = Kernel / Faktor

  threshold:                       # einfache Grauwertschwelle
    method: multiotsu_masked       # otsu_masked | multiotsu_masked | fixed
    fixed: 90                      #   fixed: Grauwert
    multiotsu_classes: 3
    multiotsu_level: 0             # 0 = dunkelste Klasse
    offset: 0                      # + = mehr gilt als Pore

  adaptive:                        # Sauvola
    window_px: 51                  # Fenster (ungerade)
    k: 0.2                         # Empfindlichkeit, groesser = strenger

  split:                           # zusammengewachsene Poren trennen
    enabled: true
    min_distance_px: 3             # min. Abstand zweier Zentren
    min_area_ratio: 0.15           # kleinere Teilstuecke sind keine eigene Pore

  merge:                           # nahe Porenteile zusammenfuehren
    enabled: true
    max_gap_px: 1                  # groesster ueberbrueckter Spalt (0 = nur Beruehrung)
    bridge_gaps: true              # Spalt der Pore zuschlagen

# --------------------------------------------------------------------------------------
# 4. BEWERTUNG / FILTER  (Reihenfolge = Auswertungsreihenfolge)
# --------------------------------------------------------------------------------------
analysis:
  size_class_edges_um: [0.0, 10.0, 25.0, 50.0, 100.0, 250.0]  # Groessenklassen im Bericht
  filters:
    # Messbarkeit
    - {name: min_diameter, enabled: true,  params: {min_diameter_px: 4.0}}
    # Form
    - {name: scratch,      enabled: true,  params: {min_aspect_ratio: 4.0, max_width_um: 4.0, max_width_px: 4.0, min_solidity: 0.6}}
    - {name: compactness,  enabled: true,  params: {min_solidity: 0.40}}
    - {name: roundness,    enabled: true,  params: {min_roundness: 0.20}}
    - {name: extent,       enabled: false, params: {min_extent: 0.30}}
    # Rauschgrenze und Ausreisser
    - {name: min_area,     enabled: true,  params: {min_area_px: 6.0}}
    - {name: max_area,     enabled: false, params: {max_area_frac: 0.5}}
    # zuschaltbar
    - {name: aspect_ratio, enabled: false, params: {max_aspect_ratio: 8.0}}
    - {name: edge,         enabled: false, params: {image_edge: 1.0}}
    - {name: circularity,  enabled: false, params: {min_circularity: 0.3}}
    - {name: solidity,     enabled: false, params: {min_solidity: 0.6}}
    - {name: contrast,     enabled: false, params: {min_contrast: 15.0}}

# --------------------------------------------------------------------------------------
# 5. MANUELLE KORREKTUREN
# --------------------------------------------------------------------------------------
corrections:
  enabled: true                    # gespeicherte Korrekturen anwenden (false = rein automatisch)
  directory: data/korrekturen      # Ablage, relativ zum Projektordner
